# Place at /etc/nginx/conf.d/qennect-admin.conf (CentOS's default nginx.conf includes
# /etc/nginx/conf.d/*.conf already — no need to touch nginx.conf itself).
#
# Replace admin.example.com with your real domain before deploying.

server {
    listen 80;
    server_name admin.example.com;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# After confirming plain HTTP works, switch to HTTPS with:
#   sudo dnf install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d admin.example.com
# certbot rewrites this file to add the 443 server block and redirect — you don't need to
# hand-write the SSL block yourself.

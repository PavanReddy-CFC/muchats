name: Deploy API to ECS

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {} # manual re-deploy of the current main, without waiting on a new push

permissions:
  contents: read

env:
  AWS_REGION: us-west-1
  ECR_REPOSITORY: chat
  ECS_CLUSTER: qennect-ecs-cluster
  ECS_SERVICE: chat-api-service
  CONTAINER_NAME: chat

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # The ECS task definition already points at this repo's :latest tag (set up once in the
      # console, wired to the service). Pushing a new :latest here doesn't restart anything by
      # itself — the force-new-deployment step below is what makes ECS pull it and roll tasks.
      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f infra/docker/Dockerfile.api \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      # Migrations can't run on this runner — RDS lives in a private VPC with no path from
      # GitHub-hosted runners. So run them as a one-off Fargate task instead, reusing the
      # service's own task definition (already pointing at :latest, just pushed above) and its
      # exact network configuration, with the command overridden. `migrate deploy` takes a
      # Postgres advisory lock, so this is safe even if it overlaps a task rollout.
      - name: Run database migrations (one-off Fargate task)
        id: migrate
        run: |
          set -euo pipefail

          TASK_DEF=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --region "$AWS_REGION" \
            --query 'services[0].taskDefinition' --output text)
          NETWORK=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --region "$AWS_REGION" \
            --query 'services[0].networkConfiguration' --output json)
          echo "Task definition: $TASK_DEF"

          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$TASK_DEF" \
            --launch-type FARGATE \
            --region "$AWS_REGION" \
            --network-configuration "$NETWORK" \
            --overrides "{\"containerOverrides\":[{\"name\":\"$CONTAINER_NAME\",\"command\":[\"sh\",\"-c\",\"./node_modules/.bin/prisma migrate deploy\"]}]}" \
            --query 'tasks[0].taskArn' --output text)
          echo "Migration task: $TASK_ARN"
          echo "task_arn=$TASK_ARN" >> "$GITHUB_OUTPUT"

          aws ecs wait tasks-stopped \
            --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" --region "$AWS_REGION"

          # Print the migration output before deciding pass/fail, so a failure is diagnosable
          # straight from the workflow log rather than requiring a CloudWatch dig.
          TASK_ID="${TASK_ARN##*/}"
          aws logs get-log-events \
            --log-group-name "/ecs/chat" \
            --log-stream-name "api/$CONTAINER_NAME/$TASK_ID" \
            --region "$AWS_REGION" \
            --query 'events[].message' --output text || echo "(could not fetch logs)"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" --region "$AWS_REGION" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          STOPPED_REASON=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" --region "$AWS_REGION" \
            --query 'tasks[0].stoppedReason' --output text)
          echo "Exit code: $EXIT_CODE / stopped reason: $STOPPED_REASON"

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration task failed"
            exit 1
          fi

      - name: Force ECS to redeploy with the new image
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION"

      - name: Wait for the service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"

      - name: Smoke test
        run: |
          curl -sf https://multi-tenant-ecs.qennect.com/chat-api/healthz \
            || (echo "Health check failed after deploy" && exit 1)

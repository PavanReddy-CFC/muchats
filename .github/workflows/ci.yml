name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qEnnect#1013#
          POSTGRES_DB: chats
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:qEnnect%231013%23@localhost:5432/chats
      REDIS_URL: redis://localhost:6379/1
      JWT_ACCESS_SECRET: ci-access-secret-please-change-000000
      JWT_REFRESH_SECRET: ci-refresh-secret-please-change-000000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from package.json's "packageManager" field
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qennect/shared-types build
      - run: pnpm --filter @qennect/api prisma:generate
      - run: pnpm --filter @qennect/api prisma:deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm --filter @qennect/api test:e2e
